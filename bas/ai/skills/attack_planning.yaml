name: attack_planning
description: "Skill for planning multi-phase attack simulations against web applications"
version: "1.0"
tags:
  - planning
  - strategy
  - mitre
system_prompt: |
  You are an expert red team operator planning authorized breach and attack simulations.
  You must always operate within the defined scope and map techniques to MITRE ATT&CK.
  Generate structured, phased attack plans that maximize coverage while minimizing risk.
few_shot_examples:
  - user: |
      Plan an attack against a web application at https://target.internal:8443
      Available modules: discovery, sqli, xss, ssrf, jwt, auth_bypass
      Authorization: standard
      Objective: Identify all exploitable vulnerabilities
    assistant: |
      {
        "phases": [
          {
            "name": "Reconnaissance",
            "module_name": "discovery",
            "description": "Enumerate technology stack, security headers, exposed endpoints",
            "targets": ["https://target.internal:8443"],
            "auth_level_required": "read_only",
            "mitre_technique_id": "T1595",
            "depends_on": []
          },
          {
            "name": "Authentication Testing",
            "module_name": "auth_bypass",
            "description": "Test for auth bypass via header manipulation, path traversal, verb tampering",
            "targets": ["https://target.internal:8443"],
            "auth_level_required": "low_impact",
            "mitre_technique_id": "T1078",
            "depends_on": ["Reconnaissance"]
          },
          {
            "name": "Injection Testing - SQL",
            "module_name": "sqli",
            "description": "Test all input parameters for SQL injection",
            "targets": ["https://target.internal:8443"],
            "auth_level_required": "low_impact",
            "mitre_technique_id": "T1190",
            "depends_on": ["Reconnaissance"]
          },
          {
            "name": "Injection Testing - XSS",
            "module_name": "xss",
            "description": "Test for reflected and stored XSS across all parameters",
            "targets": ["https://target.internal:8443"],
            "auth_level_required": "low_impact",
            "mitre_technique_id": "T1189",
            "depends_on": ["Reconnaissance"]
          },
          {
            "name": "SSRF Testing",
            "module_name": "ssrf",
            "description": "Test URL parameters for SSRF to internal services and cloud metadata",
            "targets": ["https://target.internal:8443"],
            "auth_level_required": "low_impact",
            "mitre_technique_id": "T1090",
            "depends_on": ["Reconnaissance"]
          },
          {
            "name": "JWT Analysis",
            "module_name": "jwt",
            "description": "Test JWT implementation for algorithm confusion, weak keys, signature bypass",
            "targets": ["https://target.internal:8443"],
            "auth_level_required": "low_impact",
            "mitre_technique_id": "T1550",
            "depends_on": ["Authentication Testing"]
          }
        ],
        "mitre_techniques": ["T1595", "T1078", "T1190", "T1189", "T1090", "T1550"],
        "estimated_duration_minutes": 30,
        "risk_assessment": "Standard web application assessment - low risk to availability"
      }
parameters:
  temperature: 0.3
  max_tokens: 4096
