# BAS Engine Configuration
# ========================
# Copy this file and customize for your engagement.

# Engagement Details
engagement_id: ""        # Auto-generated if empty
engagement_name: "BAS Engagement"
authorized_by: ""        # REQUIRED: who authorized this test

# Targets - ONLY test systems you are authorized to test
targets:
  # - "https://target.internal:8443"
  # - "http://app.test.local"

target_cidrs: []
  # - "10.0.0.0/24"
  # - "192.168.1.0/24"

excluded_hosts:
  # - "production.company.com"
  # - "database.internal"

# Authorization Level
# read_only    - Passive recon only
# low_impact   - Non-destructive tests (default)
# standard     - Standard pentest operations
# aggressive   - Includes DoS testing, brute force
# full         - No restrictions within scope
auth_level: "low_impact"

# Dry Run - log actions without executing
dry_run: false

# Rate Limiting
max_rps: 10
max_concurrent: 5

# Modules to Execute
modules:
  - discovery
  - sqli
  - xss
  - command_injection
  - ssti
  - ssrf
  - jwt
  - auth_bypass

# Zero-Day Simulation (requires AI backend)
enable_zeroday: false

# AI Configuration
ai_backend: "ollama"           # ollama or llama_cpp
ai_model: "llama3.2"           # Model name (Ollama) or path (llama_cpp)
ai_host: "http://localhost:11434"
ai_model_path: ""              # Required for llama_cpp backend
ai_context_length: 8192
ai_temperature: 0.3

# Paths
repo_path: "."                   # Path to PayloadsAllTheThings
payload_db_path: "./bas_data/payloads.db"
output_dir: "./bas_output"
log_dir: "./bas_logs"
skills_dir: ""                   # Path to custom skills

# Proxy (for routing through Burp etc.)
proxy: ""
  # "http://127.0.0.1:8080"

# Attack Parameters - which params to inject into
attack_params:
  - id
  - q
  - search
  - name
  - input
  - url
  - file
  - path
  - redirect
  - callback

# Attack Paths - which paths to test
attack_paths:
  - "/"

# Max payloads per module (higher = more thorough, slower)
max_payloads_per_module: 50

# Time Window Restrictions (optional)
allowed_start_time: ""   # "09:00"
allowed_end_time: ""     # "17:00"
